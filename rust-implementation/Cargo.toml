[package]
name = "rust-implementation"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
image = "0.24"
lab = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1.0"
indicatif = "0.17" # For progress bars, similar to tqdm
rerun = "0.18" # For 3D visualization
geo = "0.28" # Geometry primitives
geo-types = "0.7" # Geometry types
contour = "0.13" # Contour extraction
delaunator = "1.0" # Delaunay triangulation
opencv = "0.97.2"
