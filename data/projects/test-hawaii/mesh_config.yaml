    - *id001
    - !!binary |
      juM4juM4FkA=
  - !!python/object/apply:numpy._core.multiarray.scalar
    - *id001
    - !!binary |
      juM4juM4JkA=
  - !!python/object/apply:numpy._core.multiarray.scalar
    - *id001
    - !!binary |
      qqqqqqqqMEA=
  - !!python/object/apply:numpy._core.multiarray.scalar
    - *id001
    - !!binary |
      juM4juM4NkA=
  - !!python/object/apply:numpy._core.multiarray.scalar
    - *id001
    - !!binary |
      chzHcRzHO0A=
